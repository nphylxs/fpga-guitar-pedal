<text x="50" y="650" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#536579" font-weight="700" text-anchor="start">GROUND</text>
<rect x="35" y="710" width="550" height="330" rx="12" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/>
<text x="60" y="749" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#183246" font-weight="700" text-anchor="start">1  Wire with USB unplugged</text>
<text x="60" y="788" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">All gray ground connections share one rail.</text>
<text x="60" y="822" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Use mono ¼-inch jack sockets or breakouts.</text>
<text x="60" y="856" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Pmod JA numbering is NOT DIP numbering.</text>
<text x="60" y="890" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">DIP 24 is NOT a 3.3 V supply.</text>
<text x="60" y="924" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">C1 and C5: use nonpolar film capacitors.</text>
<text x="60" y="985" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183246" font-weight="700" text-anchor="start">Electrolytic alternative:</text>
<text x="60" y="1015" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183246" font-weight="400" text-anchor="start">C1 + toward R1; C5 + toward R4.</text>
<rect x="610" y="710" width="550" height="330" rx="12" fill="#ffffff" stroke="#d9e1e9" stroke-width="2"/>
<text x="635" y="749" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#183246" font-weight="700" text-anchor="start">2  Check DC before the amp</text>
<text x="635" y="788" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Power via USB and load the bitstream.</text>
<text x="635" y="822" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Black meter lead → ground rail.</text>
<text x="635" y="856" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">3.3 V rail → approximately 3.3 V.</text>
<text x="635" y="890" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">DIP 15 → approximately 1.6–1.7 V.</text>
<text x="635" y="924" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Amp TIP → approximately 0 V, settled.</text>
<text x="635" y="985" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183246" font-weight="700" text-anchor="start">Then connect the amp at minimum volume.</text>
<text x="635" y="1015" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183246" font-weight="400" text-anchor="start">Start in WHITE / clean mode.</text>
<rect x="1185" y="710" width="580" height="330" rx="12" fill="#fff5df" stroke="#ecd49a" stroke-width="2"/>
<text x="1210" y="749" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#183246" font-weight="700" text-anchor="start">What to expect</text>
<text x="1210" y="788" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Basic first-listen circuit, not a buffered pedal.</text>
<text x="1210" y="822" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">The onboard input network loads pickups:</text>
<text x="1210" y="856" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">volume and treble may be reduced.</text>
<text x="1210" y="890" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Do not connect a speaker output here.</text>
<text x="1210" y="924" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#183246" font-weight="400" text-anchor="start">Mute the amp before reset / reprogramming.</text>
<text x="1210" y="985" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#183246" font-weight="700" text-anchor="start">Board already includes its ADC divider.</text>
<text x="1210" y="1015" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#183246" font-weight="400" text-anchor="start">Do not add a second input bias resistor to GND.</text>
<text x="35" y="1080" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526779" font-weight="400" text-anchor="start">Electrical connection guide — not a physical breadboard-hole layout. Board ports are repositioned for readability.</text>
</svg>